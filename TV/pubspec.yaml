name: takeone_tv
description: >-
  TAKEONE hall screen for Android TV. Stands on a wall showing its pairing QR
  until an organiser scans it, then becomes whatever board it was adopted as.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # FLAG_KEEP_SCREEN_ON. This is the whole point of a native app here: an
  # Android TV browser cannot stop the launcher's daydream/screensaver.
  wakelock_plus: ^1.2.5
  # The board this screen was paired to, so a television switched off between
  # sessions comes back as itself instead of needing to be paired again.
  shared_preferences: ^2.2.3
  # The screens ARE web surfaces owned by the event packages — the pairing room
  # included. The app renders them rather than reimplementing any of them, which
  # is what keeps a TV pixel-identical to a Pi on the same wall.
  webview_flutter: ^4.14.0
  # For the one thing only the Android embedder can grant: autoplaying a board's
  # sound with no user gesture, because nobody ever touches a wall screen.
  webview_flutter_android: ^4.14.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Optional: drop Anton-Regular.ttf / BarlowCondensed-{SemiBold,Bold}.ttf into
  # assets/fonts and uncomment to match the web screen's typography exactly.
  # fonts:
  #   - family: Anton
  #     fonts:
  #       - asset: assets/fonts/Anton-Regular.ttf
  #   - family: Barlow Condensed
  #     fonts:
  #       - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/BarlowCondensed-Bold.ttf
  #         weight: 700
