name: Deploy

# Fires only after the CI workflow finishes running on main, and only
# proceeds if that run passed — so a broken build on main can never deploy.
#
# Runs on a self-hosted runner living on the same private network as the
# app's Proxmox container (192.168.0.37), since GitHub's own cloud runners
# have no route there.
#
# The runner's own checkout dir is only used as a disposable build area —
# composer/npm run there, then the built tree is rsynced into the dedicated
# deploy path (/var/www/takeone) that Apache actually serves from. .env,
# the sqlite database, and storage/ live only at the deploy path and are
# never touched by the sync.
#
# ⚠️ MANUAL ONLY (2026-10-23, owner's request: "push to production with
# extreme ease, without losing anything"). A push to main no longer reaches
# production by itself — production is shipped on purpose:
#     gh workflow run Deploy        (or Actions → Deploy → Run workflow)
# and every ship takes a verified backup first (database + uploads), puts the
# site in maintenance mode while files and migrations change, and checks the
# live site answers before it reports success.
on:
  workflow_dispatch: {}

env:
  DEPLOY_PATH: /var/www/takeone

jobs:
  deploy:
    # Both self-hosted runners carry the default "self-hosted" label, so
    # scoping to just that would let GitHub route production deploys onto
    # the staging runner — pin to the production label.
    runs-on: [self-hosted, production]
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      # RULE #2: a verified backup BEFORE anything changes — the live app's own
      # `takeone:backup` (SQLite VACUUM INTO after a WAL checkpoint, plus the
      # upload folders, each read back; non-zero exit on any failure). If it
      # fails, nothing below runs and production is exactly as it was.
      - name: Back up production (database + uploads)
        working-directory: ${{ env.DEPLOY_PATH }}
        run: php artisan takeone:backup

      # The backup above covers data, not code. Production has been hand-copied
      # before, so it can hold files that are in no commit: archive the code
      # tree as it stands, so anything the sync below replaces or deletes can
      # be got back. Secrets and runtime data stay out of the archive (they are
      # never touched by the sync anyway). Read back before going on.
      - name: Archive the current code
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          archive="storage/app/backups/code-$(date +%Y%m%d-%H%M%S).tar.gz"
          mkdir -p storage/app/backups
          tar -czf "$archive" \
            --exclude='./storage' --exclude='./vendor' --exclude='./node_modules' \
            --exclude='./.git' --exclude='./database/database.sqlite*' \
            --exclude='./.env*' --exclude='./docker/whatsapp/data' \
            --exclude='*/.gradle' .
          tar -tzf "$archive" > /dev/null
          echo "Code archived to $DEPLOY_PATH/$archive ($(du -h "$archive" | cut -f1))"

      # Visitors see the maintenance page (not a half-copied app or a 500)
      # while files are swapped and migrations run. --retry asks browsers to
      # come back on their own.
      - name: Maintenance mode on
        working-directory: ${{ env.DEPLOY_PATH }}
        run: php artisan down --retry=30

      - name: Sync build to deploy path
        # --delete keeps the deploy path in sync with what's actually in
        # main (removes files deleted from the repo), but every excluded
        # path is protected from deletion too, so persistent state never
        # gets touched by a deploy.
        # The database glob covers the -wal and -shm SIDECARS, not just the
        # database file. They are not in the repo, so without the glob --delete
        # removed them from the deploy path on every deploy — and deleting a WAL
        # out from under a live SQLite database discards whatever it still holds
        # that has not been checkpointed into the main file. That is committed
        # data (production carried a 1.4 MB WAL when this was found), so the
        # deploy could silently lose the last transactions before it.
        # Excludes are anchored with a leading slash: unanchored, 'storage/'
        # matches a folder of that name at ANY depth (deploy gotcha #1).
        # The P (protect) rules are files that exist only on production and
        # are git-ignored, so --delete would otherwise remove them: .env
        # backups, the WhatsApp container's data (its API key and database),
        # the Android APK served for download, Gradle caches, and drafts.
        # --checksum because size+mtime misses same-size changes such as the
        # Vite manifest (deploy gotcha #3).
        # -rlD, not -a: database/ and docker/ belong to root, and setting their
        # group, permissions or times fails, so rsync exits 23 after copying
        # every file and the deploy stops in maintenance mode (2026-10-30).
        # Contents are compared by --checksum, so times are not needed; new
        # files take the source's mode under the umask; ownership is handled
        # by the permissions step below.
        run: |
          rsync -rlD --checksum --delete \
            --exclude='/.env' \
            --exclude='/database/database.sqlite*' \
            --exclude='/storage/' \
            --filter='P /.env*' \
            --filter='P /docker/whatsapp/data/***' \
            --filter='P /public/app/*.apk' \
            --filter='P .gradle/***' \
            --filter='P /drafts/***' \
            --filter='P /verify-skills.php' \
            --filter='P /public/emperor-dashboard.html' \
            ./ "$DEPLOY_PATH/"

      # The owner's rule (2026-10-30): whatever is shipped is ON in production.
      # deploy/feature-flags.conf is written by scripts/ship.sh from the staging
      # .env; each KEY=value in it is set in production's .env, before the
      # config is cached below. Only switches travel: a line must be KEY=word,
      # and keys that describe the server (APP_*, DB_*, MAIL_*, …) are refused
      # here too, so the file can never change a credential or the environment.
      # Keys not in the file are left exactly as they are.
      - name: Apply feature switches
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          f=deploy/feature-flags.conf
          [ -f "$f" ] || { echo "No $f — switches left as they are."; exit 0; }
          server='^(APP|DB|MAIL|CACHE|SESSION|QUEUE|LOG|BACKUP|BROADCAST|REDIS|FILESYSTEM|VITE|AWS|PUSHER|REVERB)_|^FILE_XSENDFILE(=|$)'
          changed=0
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            if ! printf '%s' "$line" | grep -qE '^[A-Z][A-Z0-9_]*=[a-z0-9_-]*$'; then
              echo "::warning::skipped a malformed line in $f"; continue
            fi
            key=${line%%=*}; val=${line#*=}
            if printf '%s' "$key" | grep -qE "$server"; then
              echo "::warning::$key describes the server, not a feature — skipped"; continue
            fi
            old=$(grep -E "^$key=" .env | tail -1 | cut -d= -f2- || true)
            [ "$old" = "$val" ] && continue
            if grep -qE "^$key=" .env; then
              sed -i "s|^$key=.*|$key=$val|" .env
            else
              printf '\n%s=%s\n' "$key" "$val" >> .env
            fi
            echo "$key: ${old:-(unset)} -> $val"
            changed=$((changed+1))
          done < "$f"
          echo "$changed switch(es) changed."

      - name: Migrate & cache
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan event:cache
          # Copied files keep the SOURCE's mtimes, so Blade can keep a stale
          # compile: clear before caching (deploy gotcha #4, 2026-08-22).
          php artisan view:clear
          php artisan view:cache

      - name: Fix storage/cache/database permissions for Apache
        # Apache (mod_php) runs as www-data and writes into storage/ (logs,
        # cache, sessions) and database/database.sqlite on every request
        # between deploys — those writes land owned by www-data, and chmod
        # on a file you don't own fails even with group-write access.
        # Reclaiming ownership back to the runner user first (a narrowly
        # scoped NOPASSWD sudo rule) makes this step idempotent regardless
        # of what www-data wrote in between.
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          sudo chown -R actionsrunner:actionsrunner "$DEPLOY_PATH/storage" "$DEPLOY_PATH/bootstrap/cache" "$DEPLOY_PATH/database"
          chmod -R ug+rwX storage bootstrap/cache
          chmod g+w database
          chmod g+w database/database.sqlite

      - name: Restart queue workers
        # Queue workers keep running the old code in memory until they pick
        # up a fresh job — queue:restart signals them to exit after their
        # current job, and Supervisor (managing them as laravel-worker.service
        # via takeone-worker.conf) automatically brings them back up running
        # the newly deployed code.
        working-directory: ${{ env.DEPLOY_PATH }}
        run: php artisan queue:restart

      - name: Reload Apache
        run: sudo systemctl reload apache2

      - name: Maintenance mode off
        working-directory: ${{ env.DEPLOY_PATH }}
        run: php artisan up

      # The ship only counts as done when the live site answers.
      # Asked of Apache on this box, not https://takeone.bh: HTTPS ends on a
      # machine in front of this one, and this box cannot reach its own public
      # address (port 443 refused, curl 000) — so that check failed every
      # deploy, good or bad (found 2026-10-30).
      - name: Check the live site answers
        run: |
          for path in /login /; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H 'Host: takeone.bh' "http://127.0.0.1$path")
            echo "$path -> $code"
            case "$code" in 200|302) ;; *) echo "::error::takeone.bh$path answered $code after the deploy"; exit 1 ;; esac
          done

      # Anything above failed: say where the backup is and how to get back.
      # The site is left in maintenance mode if it got that far — a page that
      # says "back soon" is better than a half-migrated app serving errors.
      - name: If anything failed
        if: failure()
        working-directory: ${{ env.DEPLOY_PATH }}
        run: |
          echo "::error::Deploy failed. The backup taken at the start of this run is the newest file in storage/app/backups/."
          ls -t storage/app/backups/ | head -3 || true
          echo "To reopen the site as it is now: php artisan up"
