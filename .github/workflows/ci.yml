name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo, gd, xml, curl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run tests
        run: php artisan test

      # Static analysis. Added in Phase R1 (workstream D).
      # Pint is advisory for now: the codebase has pre-existing style drift and
      # getting to zero is a separate, deliberate phase. continue-on-error keeps
      # it reporting without ever blocking a deploy.
      - name: Check code style (Pint, non-blocking)
        continue-on-error: true
        run: vendor/bin/pint --test

      # PHPStan runs at level 0 with a committed baseline, so the existing code
      # passes cleanly and only NEW breakage fails the build.
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
