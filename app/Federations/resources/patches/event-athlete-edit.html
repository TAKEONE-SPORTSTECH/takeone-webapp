      <sc-if value="{{ ae.open }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ ae.onClose }}" style="position:fixed;inset:0;background:rgba(30,44,79,.5);z-index:60;display:grid;place-items:center;padding:20px">
          <div onClick="{{ ae.stop }}" role="dialog" aria-modal="true" aria-label="Edit athlete" style="background:#fff;border-radius:20px;max-width:680px;width:100%;height:min(880px,92vh);overflow:hidden;box-shadow:0 30px 80px rgba(30,44,79,.35);animation:rise .25s cubic-bezier(.22,.68,.35,1) both;box-sizing:border-box">
            <iframe src="{{ ae.src }}" title="Edit athlete" style="display:block;width:100%;height:100%;border:0;background:#fff"></iframe>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{ ae.hasFlash }}" hint-placeholder-val="{{ false }}">
        <div role="status" style="position:fixed;right:24px;bottom:24px;z-index:70;padding:12px 16px;border-radius:12px;background:#1e2c4f;color:#fff;font-size:.8rem;font-weight:600;box-shadow:0 14px 40px rgba(30,44,79,.3);animation:rise .25s cubic-bezier(.22,.68,.35,1) both">{{ ae.flash }}</div>
      </sc-if>
      <sc-if value="{{ ae.wg.open }}" hint-placeholder-val="{{ false }}">
        <div onClick="{{ ae.wg.onClose }}" style="position:fixed;inset:0;background:rgba(30,44,79,.5);z-index:60;display:grid;place-items:center;padding:20px">
          <div onClick="{{ ae.stop }}" role="dialog" aria-modal="true" aria-label="Weigh in" style="background:#fff;border-radius:20px;border-top:4px solid #d8b25f;max-width:400px;width:100%;padding:24px 26px;box-shadow:0 30px 80px rgba(30,44,79,.35);animation:rise .25s cubic-bezier(.22,.68,.35,1) both;box-sizing:border-box">
            <div style="font-size:.66rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8a6d20;margin-bottom:4px">Weigh-in</div>
            <h2 style="margin:0 0 16px;font-size:1.15rem;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere">{{ ae.wg.name }}</h2>
            <label for="fed-weigh-kg" style="display:block;font-size:.74rem;font-weight:600;color:#1e2c4f;margin-bottom:6px">Weight on the scale (kg)</label>
            <input id="fed-weigh-kg" type="number" min="10" max="250" step="any" inputmode="decimal" autocomplete="off" placeholder="e.g. 54.3" value="{{ ae.wg.kg }}" onChange="{{ ae.wg.onKg }}" onKeyDown="{{ ae.wg.onKey }}" style="width:100%;height:48px;border:1px solid #d5dae3;border-radius:12px;padding:0 14px;font-family:inherit;font-size:1.05rem;font-weight:600;color:#1e2c4f;outline:none;box-sizing:border-box;font-variant-numeric:tabular-nums" style-focus="border-color:#caa14f;box-shadow:0 0 0 3px rgba(216,178,95,.25)">
            <sc-if value="{{ ae.wg.hasErr }}" hint-placeholder-val="{{ false }}"><div role="alert" style="margin-top:8px;font-size:.74rem;color:#b4483c">{{ ae.wg.err }}</div></sc-if>
            <div style="font-size:.7rem;line-height:1.5;color:#6b7689;margin-top:10px">Signs the athlete off as weighed in and places them in the division this weight fits.</div>
            <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px">
              <button onClick="{{ ae.wg.onClose }}" style="height:40px;padding:0 16px;border:1px solid #d5dae3;border-radius:10px;background:#fff;font-family:inherit;font-size:.8rem;font-weight:600;color:#1e2c4f;cursor:pointer">Cancel</button>
              <button onClick="{{ ae.wg.onSave }}" style="height:40px;padding:0 18px;border:0;border-radius:10px;background:linear-gradient(100deg,#edcd85,#d0a854);font-family:inherit;font-size:.8rem;font-weight:600;color:#1e2c4f;cursor:pointer;box-shadow:0 4px 12px rgba(202,161,79,.28)">{{ ae.wg.saveLabel }}</button>
            </div>
          </div>
        </div>
      </sc-if>
