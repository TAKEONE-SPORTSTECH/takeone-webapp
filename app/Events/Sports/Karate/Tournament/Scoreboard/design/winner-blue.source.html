<style>
  *{box-sizing:border-box}
  body{margin:0;background:#07070d;color:#fff;font-family:'Poppins',system-ui,sans-serif;overflow:hidden}
  @keyframes nameSlam{0%{transform:scale(3);opacity:0;filter:blur(8px)}55%{transform:scale(.96);opacity:1;filter:blur(0)}75%{transform:scale(1.02)}100%{transform:scale(1)}}
  @keyframes riseIn{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes slideCut{from{transform:translateX(-60px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes shakeHit{0%,100%{transform:translate(0,0)}15%{transform:translate(-14px,6px)}30%{transform:translate(12px,-8px)}45%{transform:translate(-8px,-4px)}60%{transform:translate(7px,5px)}75%{transform:translate(-4px,2px)}}
  @keyframes confetti{0%{transform:translateY(-12vh) translateX(0) rotate3d(1,1,.3,0deg)}8%{opacity:1}25%{transform:translateY(18vh) translateX(3vw) rotate3d(1,1,.3,200deg)}50%{transform:translateY(48vh) translateX(-2.5vw) rotate3d(1,1,.3,400deg)}75%{transform:translateY(80vh) translateX(3vw) rotate3d(1,1,.3,600deg)}100%{transform:translateY(112vh) translateX(-1.5vw) rotate3d(1,1,.3,800deg);opacity:.85}}
  @keyframes kenBurns{from{transform:scale(1)}to{transform:scale(1.08)}}
  @keyframes textGlow{0%,100%{text-shadow:.055em .055em 0 var(--accentA), 0 0 25px rgba(255,255,255,.12)}50%{text-shadow:.055em .055em 0 var(--accentA), 0 0 70px rgba(255,255,255,.45)}}
  @keyframes beamMove{0%{transform:translateX(-40vw) skewX(-20deg)}100%{transform:translateX(140vw) skewX(-20deg)}}
  @keyframes barGrow{from{width:0;opacity:0}to{width:100%;opacity:1}}
  @keyframes shine{0%{transform:translateX(-160%) skewX(-18deg)}55%,100%{transform:translateX(280%) skewX(-18deg)}}
  @keyframes spotPulse{0%,100%{opacity:.4}50%{opacity:.75}}
  @keyframes emberFlicker{0%,100%{filter:brightness(.9) blur(.4px)}50%{filter:brightness(1.9) blur(0)}}
  @keyframes flameDance{0%{transform:scaleY(.8) scaleX(1.05) translateY(2vh)}100%{transform:scaleY(1.2) scaleX(.88) translateY(-3vh)}}
  @keyframes flashIn{0%{opacity:1}100%{opacity:0}}
  @keyframes celebOut{0%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(1.08);filter:blur(12px)}}
</style>
</head>
<body>

<div id="stage" style="position:fixed;inset:0;overflow:hidden;animation:shakeHit .5s linear 1">
  <div style="position:absolute;inset:0;background:radial-gradient(circle at 60% 45%, #fff 0%, rgba(255,255,255,.85) 30%, rgba(255,255,255,.4) 60%, transparent 100%);z-index:9;pointer-events:none;animation:flashIn .55s ease-out both"></div>
  <div id="fire" style="position:absolute;inset:0;pointer-events:none"></div>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-left:5vw;pointer-events:none">
  <div style="animation:slideCut .6s cubic-bezier(.2,1,.3,1) both">
  <div style="transform:rotate(-2deg);width:min(35vw,58vh);aspect-ratio:3/4;padding:7px;border-radius:26px;background:linear-gradient(140deg, var(--accentA), var(--accentB));box-shadow:0 0 70px var(--accentGlow), 0 40px 90px rgba(0,0,0,.65)">
    <div style="width:100%;height:100%;border-radius:20px;overflow:hidden;background:#12121e;position:relative">
      <img id="photo" alt="Winner" style="width:100%;height:100%;object-fit:cover;object-position:center top;animation:kenBurns 9s ease-in-out infinite alternate">
      <div style="position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(105deg,transparent 15%,rgba(255,255,255,.25) 50%,transparent 85%);animation:shine 4.2s ease-in-out 1.3s infinite;pointer-events:none"></div>
    </div>
  </div>
  </div>
  </div>
  <div style="position:absolute;left:60%;top:20%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle, var(--accentA) 0%, transparent 65%);filter:blur(60px);opacity:.5;animation:spotPulse 3.2s ease-in-out infinite;pointer-events:none"></div>
  <div style="position:absolute;top:-50%;bottom:-50%;left:0;width:90px;background:linear-gradient(180deg, transparent, var(--accentA), transparent);opacity:.1;animation:beamMove 8s linear infinite;pointer-events:none"></div>
  <div style="position:absolute;top:-50%;bottom:-50%;left:0;width:40px;background:linear-gradient(180deg, transparent, var(--accentB), transparent);opacity:.12;animation:beamMove 12s linear 3s infinite;pointer-events:none"></div>
  <div style="position:absolute;left:44vw;right:6vw;bottom:8vh;display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1.8vh;pointer-events:none">
    <div style="align-self:flex-end;font-size:clamp(3rem,6.8vw,6.8rem);font-weight:700;font-style:italic;line-height:1;letter-spacing:.08em;text-transform:uppercase;background:linear-gradient(100deg, var(--accentA), var(--accentB));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 34px var(--accentGlow));animation:slideCut .5s cubic-bezier(.2,1,.3,1) .1s both">Winner</div>
    <div id="name" style="position:relative;color:#fff;font-size:clamp(3.6rem,8.6vw,10.5rem);font-weight:700;font-style:italic;line-height:.96;text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:break-word;animation:nameSlam .55s cubic-bezier(.2,1.3,.4,1) .2s both, textGlow 2.6s ease-in-out .9s infinite"></div>
    <div style="height:6px;max-width:100%;border-radius:3px;background:linear-gradient(90deg, var(--accentA), var(--accentB));animation:barGrow .6s cubic-bezier(.2,1,.3,1) .55s both"></div>
    <div style="display:flex;flex-direction:row-reverse;align-items:center;gap:22px;margin-top:.4vh;animation:riseIn .5s .7s both;width:max-content">
      <img id="clubLogo" alt="Club logo" style="width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.9);object-fit:cover;background:rgba(255,255,255,.05);box-shadow:0 0 44px var(--accentGlow);display:none">
      <div id="clubMono" style="width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:#12121e;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:2.2rem;color:#fff;letter-spacing:.05em;box-shadow:0 0 44px var(--accentGlow)">KC</div>
      <div id="clubName" style="font-size:clamp(2rem,4.2vw,4rem);font-weight:700;font-style:italic;line-height:1.05;letter-spacing:.06em;text-transform:uppercase;color:#fff;white-space:nowrap;text-shadow:0 0 44px var(--accentGlow), 0 6px 24px rgba(0,0,0,.7)"></div>
    </div>
  </div>
  <div id="confetti" style="position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5"></div>
</div>

  document.getElementById('clubName').textContent = CLUB_NAME;
  document.getElementById('clubMono').textContent = CLUB_NAME.split(' ').map(function(w){return w[0]}).join('').slice(0,2);
  if (CLUB_LOGO) { var cl = document.getElementById('clubLogo'); cl.src = CLUB_LOGO; cl.style.display = 'block'; document.getElementById('clubMono').style.display = 'none'; }

  var colors = CORNER === 'red'
    ? ['#ff9d2e','#ff5e2e','#ffd08a','#ffb84d','#ff7a3d','#ffe3a8']
    : ['#eaf6ff','#bfe6ff','#8ad4ff','#ffffff','#a8ecff','#d6f1ff'];
  var box = document.getElementById('confetti');
  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 44; i++) {
    var d = document.createElement('div');
    var c = colors[i % colors.length];
    if (CORNER === 'red') {
      var s = 4 + rnd() * 6;
      d.style.cssText = 'position:absolute;top:0;left:' + ((i + 0.5) * (100 / 44)).toFixed(2) + '%;width:' + s + 'px;height:' + s + 'px;background:radial-gradient(circle, #fff2d8 0%, ' + c + ' 45%, transparent 75%);border-radius:50%;box-shadow:0 0 ' + (8 + rnd() * 10).toFixed(0) + 'px 2px ' + c + ';animation:confetti ' + (3.4 + rnd() * 3).toFixed(2) + 's linear ' + (rnd() * 3).toFixed(2) + 's infinite, emberFlicker ' + (.5 + rnd() * .9).toFixed(2) + 's ease-in-out infinite';
    } else {
      var sf = 3 + rnd() * 5;
      d.style.cssText = 'position:absolute;top:0;left:' + ((i + 0.5) * (100 / 44)).toFixed(2) + '%;width:' + sf + 'px;height:' + sf + 'px;background:radial-gradient(circle, #ffffff 0%, ' + c + ' 55%, transparent 80%);border-radius:50%;box-shadow:0 0 ' + (6 + rnd() * 8).toFixed(0) + 'px 1px ' + c + ';animation:confetti ' + (4.2 + rnd() * 3.4).toFixed(2) + 's linear ' + (rnd() * 3).toFixed(2) + 's infinite, emberFlicker ' + (.8 + rnd() * 1.2).toFixed(2) + 's ease-in-out infinite';
    }
    box.appendChild(d);
  }

  // live fire background
  (function () {
    var cols = CORNER === 'red' ? ['#ff7a3d', '#ff5e2e', '#ffb84d'] : ['#3d9bff', '#2ee6ff', '#6b9dff'];
    var baseC = CORNER === 'red' ? 'rgba(255,94,46,.32)' : 'rgba(46,155,255,.32)';
    var fire = document.getElementById('fire');
    var b = document.createElement('div');
    b.style.cssText = 'position:absolute;left:0;right:0;bottom:0;height:34vh;background:linear-gradient(to top, ' + baseC + ', transparent)';
    fire.appendChild(b);
    var s2 = 13;
    function r2(){ s2 = (s2 * 16807) % 2147483647; return s2 / 2147483647; }
    for (var j = 0; j < 12; j++) {
      var f = document.createElement('div');
      var fc = cols[j % cols.length];
      f.style.cssText = 'position:absolute;bottom:-10vh;left:' + (j * 8.3 + r2() * 4) + '%;width:' + (6 + r2() * 9) + 'vw;height:' + (20 + r2() * 18) + 'vh;border-radius:50% 50% 30% 30%;background:radial-gradient(ellipse at 50% 85%, #fff2d8 0%, ' + fc + ' 35%, transparent 72%);filter:blur(' + (18 + r2() * 16).toFixed(0) + 'px);opacity:.45;transform-origin:bottom;animation:flameDance ' + (1.4 + r2() * 1.6).toFixed(2) + 's ease-in-out ' + (r2() * 2).toFixed(2) + 's infinite alternate';
      fire.appendChild(f);
    }
  })();

  // double-click: play exit animation, then replay the whole entrance
  document.addEventListener('dblclick', function () {
    var st = document.getElementById('stage');
    st.style.animation = 'celebOut .6s ease-in both';
    setTimeout(function () { location.reload(); }, 650);
  });
</script>

</body></html>
