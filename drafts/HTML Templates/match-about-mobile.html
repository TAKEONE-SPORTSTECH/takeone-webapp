<style>
  body { margin: 0; background: #0f0f0f; font-family: 'Barlow Condensed', sans-serif; padding: 16px; }
  .match-card-m a { text-decoration: none; transition: color .15s; }
  .match-card-m a:hover { color: #ffd75e !important; }
  .match-card-m img { display: block; width: 100%; height: 100%; object-fit: cover; }
  @property --orbit { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes winner-orbit { to { --orbit: 360deg; } }
  .winner-frame { position: relative; isolation: isolate; padding: .9cqw; border-radius: 2.6cqw; }
  .winner-frame::before {
    content: ''; position: absolute; inset: 0; border-radius: 2.6cqw; z-index: 0;
    padding: .9cqw; box-sizing: border-box;
    background: conic-gradient(from var(--orbit), rgba(255,215,94,.15) 0 62%, #ffd75e 78%, #fff 85%, #ffd75e 92%, rgba(255,215,94,.15) 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: winner-orbit 2.2s linear infinite;
    filter: drop-shadow(0 0 1.2cqw rgba(255,215,94,.8));
  }
</style>
</head>
