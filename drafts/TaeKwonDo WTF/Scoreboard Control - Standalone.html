document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,0.5);\">Load sends the match to the scoreboard and resets scores<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ startNext }}\" style=\"flex:0 0 auto; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:17px; letter-spacing:0.12em; text-transform:uppercase; background:oklch(0.55 0.17 145); color:#fff; border:none; padding:11px 20px; cursor:pointer;\">Start Next Match<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;\">\n            <sc-for list=\"{{ queue }}\" as=\"q\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; align-items:center; gap:14px; background:{{ q.bg }}; border:1px solid {{ q.border }}; padding:9px 14px;\">\n                <div style=\"font-family:'Anton',sans-serif; font-size:26px; color:oklch(0.85 0.16 85); min-width:44px;\">{{ q.number }}<\u002Fdiv>\n                <div style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n                  <div style=\"font-weight:700; font-size:17px; text-transform:uppercase; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ q.redName }} <span style=\"color:oklch(0.7 0.17 25);\">vs<\u002Fspan> {{ q.blueName }}<\u002Fdiv>\n                  <div style=\"font-weight:600; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(232,230,224,0.6); white-space:nowrap;\">{{ q.stage }} · {{ q.weightClass }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ q.load }}\" style=\"flex:0 0 auto; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; letter-spacing:0.14em; text-transform:uppercase; background:{{ q.btnBg }}; color:{{ q.btnColor }}; border:1px solid oklch(0.85 0.16 85); padding:8px 16px; cursor:pointer;\">{{ q.btnLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002 (255,255,255,0.4);\"><\u002Fdiv>\n              <div style=\"font-weight:700; font-size:19px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.9); white-space:nowrap;\">{{ c.country }}<\u002Fdiv>\n              <div style=\"width:34px; height:34px; flex:0 0 auto; border-radius:50%; background-color:rgba(255,255,255,0.1); background-image:{{ c.logoBg }}; background-size:cover; background-position:center; border:1px solid rgba(255,255,255,0.35);\"><\u002Fdiv>\n              <div style=\"font-weight:600; font-size:18px; letter-spacing:0.06em; text-transform:uppercase; color:rgba(232,230,224,0.75); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;\">{{ c.club }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1; display:flex; align-items:center; justify-content:center; gap:20px;\">\n              <sc-if value=\"{{ true }}\" hint-placeholder-val=\"{{ true }}\">{{ c.scoreEl }}<\u002Fsc-if>\n              <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                <button sc-camel-on-click=\"{{ c.minus1 }}\" style=\"font-family:'Anton',sans-serif; font-size:24px; background:rgba(0,0,0,0.4); color:#ff8b80; border:1px solid rgba(255,120,110,0.5); width:56px; height:44px; cursor:pointer;\" style-hover=\"background:rgba(180,50,40,0.35);\">−1<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ c.plus1raw }}\" style=\"font-family:'Anton',sans-serif; font-size:24px; background:rgba(0,0,0,0.4); color:#9fe8a8; border:1px solid rgba(140,230,150,0.5); width:56px; height:44px; cursor:pointer;\" style-hover=\"background:rgba(60,150,80,0.35);\">+1<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px;\">\n          <button sc-camel-on-click=\"{{ c.p1 }}\" style=\"font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:19px; line-hei ent }};\"><span style=\"font-family:'Anton',sans-serif; font-size:30px; display:block;\">+5<\u002Fspan>Turn Head<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.35); border:1px solid oklch(0.85 0.16 85 / 0.4); padding:10px 14px;\">\n          <span style=\"font-weight:700; font-size:19px; letter-spacing:0.2em; text-transform:uppercase; color:oklch(0.85 0.16 85);\">Gam-jeom<\u002Fspan>\n          <button sc-camel-on-click=\"{{ c.foulMinus }}\" style=\"font-family:'Anton',sans-serif; font-size:22px; background:rgba(255,255,255,0.1); color:#e8e6e0; border:1px solid rgba(255,255,255,0.3); width:46px; height:42px; cursor:pointer;\" style-hover=\"background:rgba(255,255,255,0.2);\">−<\u002Fbutton>\n          <div style=\"display:flex; gap:7px; flex:1; justify-content:center;\">\n            <sc-for list=\"{{ c.foulDots }}\" as=\"d\" hint-placeholder-count=\"5\">\n              <div style=\"width:20px; height:20px; transform:rotate(45deg); background:{{ d.bg }}; border:2px solid {{ d.border }}; animation:{{ d.anim2 }};\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ c.foulPlus }}\" style=\"font-family:'Anton',sans-serif; font-size:22px; background:oklch(0.85 0.16 85); color:#141210; border:none; width:46px; height:42px; cursor:pointer; font-weight:800;\">+<\u002Fbutton>\n          <span style=\"font-weight:600; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(232,230,224,0.55); flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">+1 to opponent<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <!-- undo modal -->\n  <sc-if value=\"{{ undoModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeUndoModal }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:center; justify-content:center;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"width:min(520px, 92vw); max-height:calc(100vh - 48px); overflow-y:auto; box-sizing:border-box; background:#101016; border:2px solid oklch(0.85 0.16 85 / 0.7); padding:26px 28px; animation:modalPop 0.35s cubic-bezier(0.22,1,0.36,1) both; display:flex; flex-direction:column; gap:14px; box-shadow:0 30px 90px rgba(0,0,0,0.8);\">\n        <div style=\"display:flex; align-items:center; gap:12px;\">\n          <div style=\"font-family:'Anton',sans-serif; font-size:24px; letter-spacing:0.1em; text-transform:uppercase; color:oklch(0.85 0.16 85);\">Undo an Action<\u002Fdiv>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeUndoModal }}\" style=\"font-family:'Anton',sans-serif; font-size:22px; background:transparent; color:rgba(232,230,224,0.6); border:1px solid rgba(255,255,255,0.25); width:40px; height:40px; cursor:pointer;\" style-hover=\"color:#fff; border-color:#fff;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-weight:600; font-size:15px; color:rgba(232,230,224,0.55);\">Pick an action to undo — everything after it is undone too.<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <sc-for list=\"{{ undoList }}\" as=\"u\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ u.revert }}\" style=\"display:flex; align-items:center; gap:12px; text-align:left; font-family:'Barlow Condensed',sans-serif; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.2); padding:11px 16px; cursor:pointer;\" style-hover=\"background:oklch(0.85 0.16 85 / 0.15); border-color:oklch(0.85 0.16 85);\">\n              <span style=\"font-weight:600; font-size:15px; color:rgba(232,230,224,0.5); flex:0 0 auto; min-width:58px;\">{{ u.time }}<\u002Fspan>\n              <span style=\"font-weight:700; font-size:18px; color:#fff;\">{{ u.msg }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ undoEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font-weight:600; font-size:17px; color:rgba(232,230,224,0.5); text-align:center; padding:14px 0;\">Nothing to undo yet<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- hardware modal -->\n  <sc-if value=\"{{ hwModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeHwModal }}\" style=\"position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); z-index:50; display:flex; align-items:center; justify-content:center;\">\n      <div sc-camel-on-click=\"{{ stopProp }}\" style=\"width:min(620px, 92vw); max-height:calc(100vh - 48px); overflow-y:auto; box-sizing:border-box; background:#101016; border:2px solid oklch(0.85 0.16 85 / 0.7); padding:26px 28px; animation:modalPop 0.35s cubic-bezier(0.22,1,0.36,1) both; display:flex; flex-direction:column; gap:14px; box-shadow:0 30px 90px rgba(0,0,0,0.8);\">\n        <div style=\"display:flex; align-items:center; gap:12px;\">\n          <div style=\"font-family:'Anton',sans-serif; font-size:24px; letter-spacing:0.1em; text-transform:uppercase; color:oklch(0.85 0.16 85);\">Hardware<\u002Fdiv>\n          <div style=\"font-weight:600; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:rgba(232,230,224,0.5);\">{{ hwSummary }}<\u002Fdiv>\n          <div style=\"flex:1;\"><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ connectAllHw }}\" style=\"font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; letter-spacing:0.12em; text-transform:uppercase; background:oklch(0.85 0.16 85); color:#141210; border:none; padding:9px 18px; cursor:pointer;\">Connect All<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ closeHwModal }}\" style=\"font-family:'Anton',sans-serif; font-size:22px; background:transparent; color:rgba(232,230,224,0.6); border:1px solid rgba(255,255,255,0.25); width:40px; height:40px; cursor:pointer;\" style-hover=\"color:#fff; border-color:#fff;\">✕<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px;\">\n          <sc-for list=\"{{ devices }}\" as=\"d\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex; align-items:center; gap:14px; background:rgba(255,255,255,0.04); border:1px solid {{ d.border }}; padding:11px 16px;\">\n              <div style=\"width:11px; height:11px; border-radius:50%; background:{{ d.dotColor }}; flex:0 0 auto;\"><\u002Fdiv>\n              <div style=\"flex:1; min-width:0; display:flex; flex-direction:column;\">\n                <div style=\"font-weight:700; font-size:19px; text-transform:uppercase; color:#fff; white-space:nowrap;\">{{ d.name }}<\u002Fdiv>\n                <div style=\"font-weight:600; font-size:14px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(232,230,224,0.5);\">{{ d.type }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:0 0 auto; min-width:120px;\">\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                  <span style=\"font-weight:600; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(232,230,224,0.5);\">Battery<\u002Fspan>\n                  <div style=\"width:56px; height:12px; border:1px solid rgba(255,255,255,0.35); padding:1px;\">\n                    <div style=\"height:100%; width:{{ d.batteryPct }}; background:{{ d.batteryColor }};\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-weight:700; font-size:15px; color:#e8e6e0; min-width:38px; text-align:right;\">{{ d.batteryLabel }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:8px;\">\n                  <span style=\"font-weight:600; font-size:13px; letter-spacing:0.1em; text-transform:uppercase; color:rgba(232,230,224,0.5);\">Signal<\u002Fspan>\n                  <div style=\"display:flex; align-items:flex-end; gap:2px; height:14px;\">\n                    <sc-for list=\"{{ d.bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                      <div style=\"width:5px; height:{{ b.h }}; background:{{ b.bg }};\"><\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ d.toggle }}\" style=\"flex:0 0 auto; font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:15px; letter-spacing:0.1em; text-transform:uppercase; background:{{ d.btnBg }}; color:{{ d.btnColor }}; border:1px solid {{ d.btnBorder }}; padding:8px 16px; cursor:pointer; min-width:110px;\">{{ d.btnLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;eventTitle&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;NATIONAL TAEKWONDO CHAMPIONSHIP 2026&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Event&quot;},\n  &quot;eventLogo&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Event&quot;, &quot;description&quot;: &quot;URL of the championship logo&quot;},\n  &quot;matchNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;104&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Match&quot;},\n  &quot;courtNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Match&quot;},\n  &quot;weightClass&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;M -68 KG&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Match&quot;},\n  &quot;category&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Senior · Kyorugi&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Match&quot;},\n  &quot;roundSeconds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 120, &quot;min&quot;: 30, &quot;max&quot;: 300, &quot;unit&quot;: &quot;s&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Match&quot;},\n  &quot;totalRounds&quot;: {&quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 3, &quot;min&quot;: 1, &quot;max&quot;: 5, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Match&quot;},\n  &quot;redName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Kenji Yamamoto&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Red corner&quot;},\n  &quot;redCountry&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Japan&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Red corner&quot;},\n  &quot;redFlagCode&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;jp&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Red corner&quot;},\n  &quot;redClub&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Budokan Elite Dojo&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Red corner&quot;},\n  &quot;redLogo&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Red corner&quot;},\n  &quot;redPhoto&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Red corner&quot;},\n  &quot;blueName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Rafael Costa&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue corner&quot;},\n  &quot;blueCountry&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Brazil&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue corner&quot;},\n  &quot;blueFlagCode&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;br&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue corner&quot;},\n  &quot;blueClub&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;São Paulo Fight Academy&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue corner&quot;},\n  &quot;blueLogo&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue corner&quot;},\n  &quot;bluePhoto&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Blue corner&quot;},\n  &quot;matchesJson&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Queue&quot;, &quot;description&quot;: &quot;JSON array: [{number, stage, weightClass, redName, redCountry, redFlag, redClub, redLogo, redPhoto, blueName, blueCountry, blueFlag, blueClub, blueLogo, bluePhoto}]. Empty = sample queue.&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    red: 0, blue: 0, redFouls: 0, blueFouls: 0,\n    round: 1, golden: false, phase: 'round', // 'round' | 'rest'\n    remaining: 120, running: false,\n    log: [], history: [], current: null, loadedNumber: null,\n    apiUrl: (typeof localStorage !== 'undefined' && localStorage.getItem('tkd-api-url')) || '',\n    connected: false, serverQueue: null, syncStatus: 'Not connected', syncKind: 'idle',\n    serverModalOpen: false, undoModalOpen: false, hwModalOpen: false,\n    fileQueue: null, fileStatus: '', fileStatusKind: 'idle', doneNumbers: [],\n    dataTab: 'server',\n    manual: { number: '', stage: 'Friendly', weightClass: '', redName: '', redCountry: '', redFlag: '', redClub: '', blueName: '', blueCountry: '', blueFlag: '', blueClub: '' },\n    devices: [\n      { id: 'j1', name: 'Referee Joypad 1', type: 'Judge scoring device', connected: false },\n      { id: 'j2', name: 'Referee Joypad 2', type: 'Judge scoring device', connected: false },\n      { id: 'j3', name: 'Referee Joypad 3', type: 'Judge scoring device', connected: false },\n      { id: 'rh', name: 'Red E-Hogu', type: 'Body protector · PSS', connected: false },\n      { id: 'bh', name: 'Blue E-Hogu', type: 'Body protector · PSS', connected: false },\n      { id: 'rg', name: 'Red E-Headgear', type: 'Head protector · PSS', connected: false },\n      { id: 'bg', name: 'Blue E-Headgear', type: 'Head protector · PSS', connected: false },\n    ],\n  };\n  async _connect() {\n    const url = (this.state.apiUrl || '').replace(/\\/+$/, '');\n    if (!url) { this.setState({ syncStatus: 'Enter the server URL first', syncKind: 'err' }); return; }\n    try { localStorage.setItem('tkd-api-url', url); } catch (e) {}\n    this.setState({ syncStatus: 'Connecting…', syncKind: 'busy' });\n    try {\n      const r = await fetch(url + '/matches?court=' + encodeURIComponent(this.props.courtNumber ?? '1'), { headers: { 'Accept': 'application/json' } });\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      const data = await r.json();\n      const list = Array.isArray(data) ? data : data.matches;\n      if (!Array.isArray(list)) throw new Error('Unexpected response shape');\n      this.setState(s => ({ connected: true, serverQueue: list, syncStatus: 'Connected · ' + list.length + ' matches pulled', syncKind: 'ok', log: ['Pulled ' + list.length + ' matches from server', ...s.log].slice(0, 8) }));\n    } catch (e) {\n      this.setState({ connected: false, syncStatus: 'Connection failed: ' + e.message, syncKind: 'err' });\n    }\n  }\n  _normalizeRows(rows) {\n    const norm = k => String(k).toLowerCase().replace(/[^a-z0-9]/g, '');\n    const keyMap = {\n      number: ['number', 'matchnumber', 'match', 'no'], stage: ['stage', 'phase', 'round'],\n      weightClass: ['weightclass', 'weight', 'class'],\n      redName: ['redname', 'redfighter', 'redathlete'], redCountry: ['redcountry'], redFlag: ['redflag', 'redflagcode', 'rediso'],\n      redClub: ['redclub'], redLogo: ['redlogo', 'redclublogo'], redPhoto: ['redphoto', 'redpicture'],\n      blueName: ['bluename', 'bluefighter', 'blueathlete'], blueCountry: ['bluecountry'], blueFlag: ['blueflag', 'blueflagcode', 'blueiso'],\n      blueClub: ['blueclub'], blueLogo: ['bluelogo', 'blueclublogo'], bluePhoto: ['bluephoto', 'bluepicture'],\n    };\n    return rows.map(r => {\n      const lookup = {};\n      Object.keys(r).forEach(k => { lookup[norm(k)] = r[k]; });\n      const m = {};\n      Object.entries(keyMap).forEach(([field, aliases]) => {\n        for (const a of aliases) { if (lookup[a] !== undefined && lookup[a] !== '') { m[field] = String(lookup[a]).trim(); break; } }\n      });\n      return m;\n    }).filter(m => m.number || m.redName || m.blueName);\n  }\n  _onFile(e) {\n    const file = e.target.files && e.target.files[0];\n    if (!file) return;\n    this.setState({ fileStatus: 'Reading ' + file.name + '…', fileStatusKind: 'busy' });\n    const isCsv = /\\.csv$/i.test(file.name);\n    const reader = new FileReader();\n    reader.onerror = () => this.setState({ fileStatus: 'Could not read file', fileStatusKind: 'err' });\n    reader.onload = () => {\n      try {\n        let rows;\n        if (!isCsv && typeof XLSX !== 'undefined') {\n          const wb = XLSX.read(reader.result, { type: 'array' });\n          rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });\n        } else {\n          const text = isCsv ? reader.result : new TextDecoder().decode(reader.result);\n          const lines = text.split(/\\r?\\n/).filter(l => l.trim());\n          const headers = lines[0].split(',').map(h => h.trim().replace(/^\"|\"$/g, ''));\n          rows = lines.slice(1).map(l => {\n            const cells = l.split(',').map(c => c.trim().replace(/^\"|\"$/g, ''));\n            const o = {}; headers.forEach((h, i) => { o[h] = cells[i] ?? ''; }); return o;\n          });\n        }\n        const matches = this._normalizeRows(rows);\n        if (!matches.length) throw new Error('no valid rows found');\n        this.setState(s => ({ fileQueue: matches, doneNumbers: [], fileStatus: file.name + ' — ' + matches.length + ' matches loaded', fileStatusKind: 'ok', log: ['Loaded ' + matches.length + ' matches from ' + file.name, ...s.log].slice(0, 8) }));\n      } catch (err) {\n        this.setState({ fileStatus: 'Import failed: ' + err.message, fileStatusKind: 'err' });\n      }\n    };\n    reader.readAsArrayBuffer(file);\n  }\n  async _endAndUpload() {\n    const s = this.state, p = this.props, c = s.current || {};\n    const winner = s.red === s.blue ? 'TIE — decide by superiority' : (s.red > s.blue ? 'red' : 'blue');\n    const payload = {\n      matchNumber: c.number ?? (p.matchNumber ?? '104'),\n      courtNumber: p.courtNumber ?? '1',\n      weightClass: c.weightClass ?? (p.weightClass ?? 'M -68 KG'),\n      category: c.stage ?? (p.category ?? 'Senior · Kyorugi'),\n      red: { name: c.redName ?? (p.redName ?? ''), country: c.redCountry ?? '', club: c.redClub ?? '', score: s.red, gamJeom: s.redFouls },\n      blue: { name: c.blueName ?? (p.blueName ?? ''), country: c.blueCountry ?? '', club: c.blueClub ?? '', score: s.blue, gamJeom: s.blueFouls },\n      rounds: s.golden ? 'golden' : s.round,\n      winner, endedAt: new Date().toISOString(),\n    };\n    const url = (this.state.apiUrl || '').replace(/\\/+$/, '');\n    if (!url) {\n      this.setState(x => ({ syncStatus: 'No server — result kept locally', syncKind: 'ok', running: false, doneNumbers: [...x.doneNumbers, payload.matchNumber], log: ['Match ' + payload.matchNumber + ' ended — ' + winner + ' (' + s.red + ':' + s.blue + ')', ...x.log].slice(0, 8) }));\n      console.log('Match result:', payload); return;\n    }\n    this.setState({ syncStatus: 'Uploading result…', syncKind: 'busy' });\n    try {\n      const r = await fetch(url + '/results', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });\n      if (!r.ok) throw new Error('HTTP ' + r.status);\n      this.setState(x => ({ syncStatus: 'Result uploaded · winner: ' + winner, syncKind: 'ok', running: false, doneNumbers: [...x.doneNumbers, payload.matchNumber], log: ['Match ' + payload.matchNumber + ' ended — ' + winner + ' (' + s.red + ':' + s.blue + ') uploaded', ...x.log].slice(0, 8) }));\n    } catch (e) {\n      this.setState({ syncStatus: 'Upload failed: ' + e.message + ' — result kept locally', syncKind: 'err' });\n      console.log('Match result (not uploaded):', payload);\n    }\n  }\n  _broadcast() {\n    const s = this.state, p = this.props, c = s.current || {};\n    const data = {\n      eventTitle: p.eventTitle, eventLogo: p.eventLogo,\n      matchNumber: c.number ?? (p.matchNumber ?? '104'),\n      courtNumber: p.courtNumber ?? '1',\n      weightClass: c.weightClass ?? (p.weightClass ?? 'M -68 KG'),\n      category: c.stage ?? (p.category ?? 'Senior · Kyorugi'),\n      roundNumber: s.golden ? 'G' : s.round, remaining: s.remaining, running: s.running, phase: s.phase,\n      redScore: s.red, blueScore: s.blue, redFouls: s.redFouls, blueFouls: s.blueFouls,\n      redName: c.redName ?? (p.redName ?? 'Kenji Yamamoto'), blueName: c.blueName ?? (p.blueName ?? 'Rafael Costa'),\n      redCountry: c.redCountry ?? p.redCountry, blueCountry: c.blueCountry ?? p.blueCountry,\n      redFlagCode: c.redFlag ?? p.redFlagCode, blueFlagCode: c.blueFlag ?? p.blueFlagCode,\n      redClub: c.red
